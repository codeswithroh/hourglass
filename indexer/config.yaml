# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: hourglass-indexer
description: GPU-hour market — forward curve, provider reliability, lease lifecycle, DON probe history
contracts:
  - name: Hourglass
    abi_file_path: abis/Hourglass.json
    handler: src/EventHandlers.ts
    events:
      - event: ProviderRegistered
      - event: BondDeposited
      - event: BondWithdrawn
      - event: SeriesCreated
      - event: PrimaryOfferingSet
      - event: HoursMinted
      - event: PrimaryPurchase
      - event: LeaseRequested
      - event: LeaseProvisioned
      - event: LeaseProbed
      - event: LeaseSettled
      - event: LeaseSlashed
      - event: SeriesExpired
  - name: ComputeHourToken
    abi_file_path: abis/ComputeHourToken.json
    handler: src/EventHandlers.ts
    events:
      - event: Transfer
chains:
  - id: 10143 # Monad testnet
    start_block: 66737557 # Hourglass deployment (deployments/monad-testnet.json)
    # HyperSync (Envio Cloud / ENVIO_API_TOKEN) is primary; public RPC within Monad's 100-block getLogs cap as fallback.
    rpc:
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: Hourglass
        address: "0xA8EA1800A9bd1EE278902E9F782BEfFbad0CF380" # deployments/monad-testnet.json
      - name: ComputeHourToken
        # registered dynamically from SeriesCreated
